<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - TrainerAI 培训师AI工具仓</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--primary:#1e3a5f;--accent:#6366f1;--accent2:#8b5cf6;--bg:#0f172a;--card:#1e293b;
--card-hover:#253348;--text:#e2e8f0;--text-muted:#94a3b8;--border:#334155;
--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--gradient:linear-gradient(135deg,#6366f1,#8b5cf6);
--radius:12px;--shadow:0 4px 24px rgba(0,0,0,0.3);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit}

/* NAV */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(15,23,42,0.92);
backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;
justify-content:space-between;padding:0 24px;z-index:1000}
.nav-brand{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700}
.nav-logo{width:36px;height:36px;background:var(--gradient);border-radius:8px;display:flex;
align-items:center;justify-content:center;font-size:1.1rem;color:#fff}

/* LOGIN CONTAINER */
.login-wrapper{width:100%;max-width:420px;padding-top:64px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
padding:40px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient)}
.login-card h1{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:8px}
.login-card .subtitle{color:var(--text-muted);text-align:center;font-size:.9rem;margin-bottom:28px}

/* TABS */
.tabs{display:flex;gap:0;margin-bottom:28px;background:var(--bg);border-radius:8px;padding:4px}
.tab-btn{flex:1;padding:10px;text-align:center;border-radius:6px;font-size:.95rem;font-weight:600;
color:var(--text-muted);transition:all .2s;background:transparent}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover:not(.active){color:var(--text)}

/* FORM */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.85rem;font-weight:500;color:var(--text-muted);margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);
border-radius:8px;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:var(--accent)}
.form-group input::placeholder{color:#475569}

.btn-submit{width:100%;padding:14px;background:var(--gradient);color:#fff;border-radius:8px;
font-size:1rem;font-weight:600;transition:opacity .2s,transform .1s;margin-top:4px}
.btn-submit:hover{opacity:.9}
.btn-submit:active{transform:scale(0.98)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

.form-footer{text-align:center;margin-top:16px;font-size:.85rem;color:var(--text-muted)}
.form-footer a{color:var(--accent);font-weight:500;cursor:pointer}
.form-footer a:hover{text-decoration:underline}

/* TAB CONTENT */
.tab-content{display:none}
.tab-content.active{display:block}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
padding:14px 28px;border-radius:10px;font-size:.9rem;font-weight:500;z-index:9999;
opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center;
box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:#065f46;border:1px solid #10b981;color:#6ee7b7}
.toast.error{background:#7f1d1d;border:1px solid #ef4444;color:#fca5a5}

/* FOOTER */
.footer{text-align:center;padding:40px 24px 24px;color:var(--text-muted);font-size:.8rem}
.footer a{color:var(--accent)}

/* SPINNER */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);
border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* RESPONSIVE */
@media(max-width:480px){
  .login-card{padding:28px 20px}
  .login-wrapper{padding:80px 16px 24px}
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <span class="nav-logo">🦐</span>
    <span>TrainerAI 培训师AI工具仓</span>
  </a>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Login Card -->
<div class="login-wrapper">
  <div class="login-card">
    <h1>欢迎回来</h1>
    <p class="subtitle">登录以使用 TrainerAI 全部功能</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">登录</button>
      <button class="tab-btn" onclick="switchTab('register')">注册</button>
    </div>

    <!-- Login Form -->
    <div class="tab-content active" id="loginTab">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="loginBtn">登录</button>
      </form>
      <div class="form-footer">
        <a onclick="showToast('请联系管理员重置密码', 'error')">忘记密码？</a>
      </div>
    </div>

    <!-- Register Form -->
    <div class="tab-content" id="registerTab">
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">姓名</label>
          <input type="text" id="regName" placeholder="请输入您的姓名" required>
        </div>
        <div class="form-group">
          <label for="regEmail">邮箱</label>
          <input type="email" id="regEmail" placeholder="your@email.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPassword">密码</label>
          <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="regPasswordConfirm">确认密码</label>
          <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="regBtn">立即注册</button>
      </form>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <p>&copy; 2026 TrainerAI 培训师AI工具仓 · 让培训更智能</p>
</div>

<script>
const SUPABASE_URL = 'https://omcxlxcamweynlgfvcqy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XYLqYjkf-c3baMDdZ3yCgQ_37OCkSed';

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
  });
  document.getElementById('loginTab').classList.toggle('active', tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
  clearToast();
}

// Toast
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}
function clearToast() {
  clearTimeout(toastTimer);
  document.getElementById('toast').classList.remove('show');
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>处理中...';
  } else {
    btn.disabled = false;
    btn.textContent = btnId === 'loginBtn' ? '登录' : '立即注册';
  }
}

// Login
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  setLoading('loginBtn', true);
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.msg || data.error_description || '登录失败，请检查邮箱和密码');
    }
    localStorage.setItem('sb_token', data.access_token);
    localStorage.setItem('sb_user', JSON.stringify(data.user));
    showToast('登录成功，正在跳转...', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    setLoading('loginBtn', false);
  }
}

// Register
async function handleRegister(e) {
  e.preventDefault();
  const fullName = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;

  if (password !== passwordConfirm) {
    showToast('两次输入的密码不一致', 'error');
    return;
  }
  if (password.length < 6) {
    showToast('密码至少需要6位', 'error');
    return;
  }

  setLoading('regBtn', true);
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email,
        password,
        data: { full_name: fullName }
      })
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.msg || data.error_description || '注册失败，请稍后重试');
    }
    showToast('注册成功，请查收验证邮件后登录', 'success');
    document.getElementById('registerForm').reset();
    setTimeout(() => switchTab('login'), 2000);
  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    setLoading('regBtn', false);
  }
}
</script>
</body>
</html>
