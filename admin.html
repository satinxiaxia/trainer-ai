<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrainerAI 管理后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#1e293b;border-bottom:1px solid #334155;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-brand{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-status{font-size:.8rem;color:#94a3b8}
.header-status span{color:#10b981;font-weight:600}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.section-title{font-size:1rem;font-weight:700;color:#e2e8f0;margin:28px 0 14px;display:flex;align-items:center;gap:8px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:8px}
.kpi-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;text-align:center}
.kpi-label{font-size:.78rem;color:#94a3b8;margin-bottom:8px}
.kpi-value{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kpi-sub{font-size:.72rem;color:#64748b;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:14px;color:#cbd5e1}
.hot-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1e293b}
.hot-item:last-child{border-bottom:none}
.hot-rank{width:22px;height:22px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.hot-name{flex:1;font-size:.85rem}
.hot-count{font-size:.78rem;color:#6366f1;font-weight:600;white-space:nowrap}
.recent-item{padding:10px 0;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:flex-start}
.recent-item:last-child{border-bottom:none}
.recent-tool{font-size:.85rem;font-weight:600}
.recent-time{font-size:.75rem;color:#94a3b8;white-space:nowrap;margin-left:10px}
.recent-module{font-size:.72rem;color:#6366f1;margin-top:2px}
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 12px;color:#94a3b8;border-bottom:1px solid #334155;font-weight:600;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #1e293b;vertical-align:middle}
tr:hover td{background:#253348}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.badge-purple{background:#312e81;color:#a5b4fc}
.badge-blue{background:#1e3a5f;color:#93c5fd}
.loading{text-align:center;padding:40px;color:#64748b;font-size:.9rem}
.empty{text-align:center;padding:30px;color:#64748b;font-size:.85rem}
.refresh-btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:#fff;padding:6px 16px;border-radius:8px;font-size:.82rem;cursor:pointer;font-weight:600}
.refresh-btn:hover{opacity:.85}
.back-btn{background:transparent;border:1px solid #334155;color:#94a3b8;padding:6px 14px;border-radius:6px;font-size:.82rem;cursor:pointer}
.back-btn:hover{border-color:#6366f1;color:#e2e8f0}
.tab-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:.85rem;transition:all .2s}
.tab.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff;font-weight:600}
.tab-panel{display:none}
.tab-panel.active{display:block}
.module-bar-wrap{margin-top:8px}
.module-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.82rem}
.module-bar-label{width:100px;color:#94a3b8;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.module-bar-track{flex:1;background:#1e3a5f;border-radius:4px;height:18px;overflow:hidden}
.module-bar-fill{height:100%;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:4px;transition:width .6s ease;display:flex;align-items:center;padding-left:6px;font-size:.7rem;font-weight:600;color:#fff;min-width:30px}
.module-bar-count{width:36px;text-align:right;color:#94a3b8;flex-shrink:0}
#lastUpdate{font-size:.72rem;color:#64748b}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">🤖 TrainerAI 管理后台</div>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="lastUpdate" class="header-status">正在加载...</span>
    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
    <button class="back-btn" onclick="window.open('index.html','_blank')">← 用户端</button>
  </div>
</div>

<div class="container">

  <!-- TAB 导航 -->
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('overview',this)">📊 数据概览</button>
    <button class="tab" onclick="switchTab('tools',this)">🔧 工具统计</button>
    <button class="tab" onclick="switchTab('records',this)">📋 使用记录</button>
    <button class="tab" onclick="switchTab('modules',this)">📈 模块分析</button>
  </div>

  <!-- 数据概览 -->
  <div class="tab-panel active" id="panel-overview">
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="kpi-label">工具使用总次数</div><div class="kpi-value" id="k-total">-</div><div class="kpi-sub">累计</div></div>
      <div class="kpi-card"><div class="kpi-label">今日使用次数</div><div class="kpi-value" id="k-today">-</div><div class="kpi-sub">今天</div></div>
      <div class="kpi-card"><div class="kpi-label">注册用户数</div><div class="kpi-value" id="k-users">-</div><div class="kpi-sub">已登录使用的账号</div></div>
      <div class="kpi-card"><div class="kpi-label">最活跃模块</div><div class="kpi-value" id="k-module" style="font-size:1.1rem;padding-top:6px">-</div><div class="kpi-sub">使用最多</div></div>
    </div>

    <div class="grid2" style="margin-top:14px">
      <div class="card">
        <div class="card-title">🔥 热门工具 Top 8</div>
        <div id="hotList"><div class="loading">加载中...</div></div>
      </div>
      <div class="card">
        <div class="card-title">🕐 最新使用记录</div>
        <div id="recentList"><div class="loading">加载中...</div></div>
      </div>
    </div>
  </div>

  <!-- 工具统计 -->
  <div class="tab-panel" id="panel-tools">
    <div class="card">
      <div class="card-title">🛠️ 所有工具使用次数</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>工具名称</th><th>所属模块</th><th>使用次数</th><th>最近使用</th></tr></thead>
          <tbody id="toolsTable"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 使用记录 -->
  <div class="tab-panel" id="panel-records">
    <div class="card">
      <div class="card-title">📋 全部使用记录（最新100条）</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>用户账号</th><th>工具名称</th><th>模块</th><th>设备</th></tr></thead>
          <tbody id="recordsTable"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 模块分析 -->
  <div class="tab-panel" id="panel-modules">
    <div class="card">
      <div class="card-title">📈 各模块使用分布</div>
      <div class="module-bar-wrap" id="moduleChart"><div class="loading">加载中...</div></div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://omcxlxcamweynlgfvcqy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_XYLqYjkf-c3baMDdZ3yCgQ_37OCkSed';

const MODULE_NAME = {
  analysis:'🔍 需求分析', design:'📐 课程设计', development:'🛠️ 资料制作',
  implementation:'🎮 互动体验', evaluation:'📊 培训评估', promotion:'📢 课程宣发', innovation:'✨ 创新场景'
};

function timeAgo(iso) {
  const d = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d/60) + '分钟前';
  if (d < 86400) return Math.floor(d/3600) + '小时前';
  return Math.floor(d/86400) + '天前';
}
function fmtTime(iso) {
  const t = new Date(iso);
  return `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
}
function devIcon(ua='') {
  if (/iPhone|Android/.test(ua)) return '📱 手机';
  if (/iPad/.test(ua)) return '📱 平板';
  return '💻 电脑';
}

async function loadData() {
  document.getElementById('lastUpdate').textContent = '加载中...';
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tool_events?select=tool_name,module_id,created_at,user_agent&order=created_at.desc&limit=1000`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
    document.getElementById('lastUpdate').innerHTML = `上次更新 <span>${new Date().toLocaleTimeString('zh-CN')}</span>`;
  } catch(e) {
    document.getElementById('lastUpdate').textContent = '加载失败: ' + e.message;
    console.error(e);
  }
}

function render(data) {
  const today = new Date(); today.setHours(0,0,0,0);
  const todayData = data.filter(x => new Date(x.created_at) >= today);

  // KPI
  const toolSet = new Set(data.map(x=>x.tool_name));
  const moduleCounts = {};
  data.forEach(x => { moduleCounts[x.module_id] = (moduleCounts[x.module_id]||0)+1; });
  const topModule = Object.entries(moduleCounts).sort((a,b)=>b[1]-a[1])[0];

  const safeSet = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
  safeSet('k-total', data.length);
  safeSet('k-today', todayData.length);
  safeSet('k-tools', toolSet.size);
  safeSet('k-module', topModule ? (MODULE_NAME[topModule[0]]||topModule[0]) : '-');

  // 热门工具
  const toolCounts = {};
  data.forEach(x => { toolCounts[x.tool_name] = (toolCounts[x.tool_name]||0)+1; });
  const sortedTools = Object.entries(toolCounts).sort((a,b)=>b[1]-a[1]);
  const hotEl = document.getElementById('hotList');
  if (sortedTools.length === 0) {
    hotEl.innerHTML = '<div class="empty">暂无数据</div>';
  } else {
    hotEl.innerHTML = sortedTools.slice(0,8).map(([name,cnt],i) =>
      `<div class="hot-item">
        <span class="hot-rank">${i+1}</span>
        <span class="hot-name">${name}</span>
        <span class="hot-count">${cnt}次</span>
      </div>`
    ).join('');
  }

  // 最新记录
  const recentEl = document.getElementById('recentList');
  if (data.length === 0) {
    recentEl.innerHTML = '<div class="empty">暂无记录</div>';
  } else {
    recentEl.innerHTML = data.slice(0,8).map(x =>
      `<div class="recent-item">
        <div>
          <div class="recent-tool">${x.tool_name}</div>
          <div class="recent-module">${MODULE_NAME[x.module_id]||x.module_id||'未知'}</div>
        </div>
        <div class="recent-time">${timeAgo(x.created_at)}</div>
      </div>`
    ).join('');
  }

  // 工具统计表格
  const tbody = document.getElementById('toolsTable');
  if (sortedTools.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
  } else {
    const toolMeta = {};
    data.forEach(x => {
      if (!toolMeta[x.tool_name]) toolMeta[x.tool_name] = { module: x.module_id, last: x.created_at };
    });
    tbody.innerHTML = sortedTools.map(([name,cnt],i) => {
      const meta = toolMeta[name]||{};
      const mod = MODULE_NAME[meta.module]||meta.module||'-';
      return `<tr>
        <td style="color:#64748b">${i+1}</td>
        <td><strong>${name}</strong></td>
        <td><span class="badge badge-purple">${mod}</span></td>
        <td><strong style="color:#6366f1">${cnt}</strong></td>
        <td style="color:#94a3b8;font-size:.78rem">${meta.last?fmtTime(meta.last):'-'}</td>
      </tr>`;
    }).join('');
  }

  // 使用记录表格（含用户账号）
  const rtbody = document.getElementById('recordsTable');
  if (data.length === 0) {
    rtbody.innerHTML = '<tr><td colspan="5" class="empty">暂无记录</td></tr>';
  } else {
    rtbody.innerHTML = data.slice(0,100).map(x => {
      const userShow = x.user_email
        ? `<div style="font-size:.82rem;font-weight:600">${x.user_name||x.user_email}</div><div style="font-size:.7rem;color:#64748b">${x.user_email}</div>`
        : `<span style="color:#64748b;font-size:.78rem">未登录访客</span>`;
      return `<tr>
        <td style="white-space:nowrap;color:#94a3b8;font-size:.78rem">${fmtTime(x.created_at)}</td>
        <td>${userShow}</td>
        <td><strong>${x.tool_name}</strong></td>
        <td><span class="badge badge-blue">${MODULE_NAME[x.module_id]||x.module_id||'-'}</span></td>
        <td style="font-size:.8rem">${devIcon(x.user_agent)}</td>
      </tr>`;
    }).join('');
  }

  // 注册用户KPI（统计唯一邮箱数）
  const uniqueUsers = new Set(data.filter(x=>x.user_email).map(x=>x.user_email)).size;
  const kpiUsersEl = document.getElementById('k-users');
  if (kpiUsersEl) kpiUsersEl.textContent = uniqueUsers;
  // 已使用工具数
  const kpiToolsEl = document.getElementById('k-tools');
  if (kpiToolsEl) kpiToolsEl.textContent = toolSet.size;

  // 模块柱状图
  const maxVal = Math.max(...Object.values(moduleCounts), 1);
  const moduleEl = document.getElementById('moduleChart');
  const moduleOrder = ['analysis','design','development','implementation','evaluation','promotion','innovation'];
  if (Object.keys(moduleCounts).length === 0) {
    moduleEl.innerHTML = '<div class="empty">暂无数据</div>';
  } else {
    moduleEl.innerHTML = moduleOrder.map(key => {
      const cnt = moduleCounts[key]||0;
      const pct = Math.round(cnt/maxVal*100);
      return `<div class="module-bar-row">
        <div class="module-bar-label" title="${MODULE_NAME[key]||key}">${MODULE_NAME[key]||key}</div>
        <div class="module-bar-track">
          <div class="module-bar-fill" style="width:${pct}%">${cnt>0?cnt:''}</div>
        </div>
        <div class="module-bar-count">${cnt}</div>
      </div>`;
    }).join('');
  }
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

// 加载数据
loadData();
// 每60秒自动刷新
setInterval(loadData, 60000);
</script>
</body>
</html>
